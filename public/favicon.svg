<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#e5a00d" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c42e"/>
      <stop offset="100%" stop-color="#c77a08"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#1a1a1a"/>
  <!-- Square outline, top-right corner curled inward (notification / sticky note) -->
  <path
    d="M10 10 L22 10 Q20 12 22 14 L22 22 L10 22 L10 10 Z"
    fill="none"
    stroke="url(#orange)"
    stroke-width="1.35"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
